# Sentinela — detecção AUTOMÁTICA de mudança de visibilidade (privado➞público)
# Roda a cada 5 min no watchdog PÚBLICO (Actions ilimitadas), cobrindo TODOS os
# alvos privados de TARGET_REPOS (onde Actions não rodam neste plano). Ao
# capturar uma abertura, dispara guard.yml com input target=<repo> — guarda
# DEDICADA por repositório (deadline independente = paralelismo real).
name: Sentinela — Detecção de Visibilidade

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      inactivity_minutes:
        description: 'Limite de inatividade (min) repassado à guarda'
        default: '30'

permissions:
  contents: write   # persistir estado no branch `state`
  actions: write    # disparar guard.yml (target=<repo>)

concurrency:
  group: watchdog-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    name: Varrer visibilidade dos alvos (TARGET_REPOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Detectar transições de visibilidade
        env:
          WATCHDOG_PAT: ${{ secrets.WATCHDOG_PAT }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOS: ${{ vars.TARGET_REPOS || '' }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'camillanapoles/agentic' }}
          WATCHDOG_REPO: ${{ github.repository }}
          INACTIVITY_MINUTES: ${{ vars.INACTIVITY_MINUTES || inputs.inactivity_minutes || '30' }}
        run: bash watchdog.sh detect
